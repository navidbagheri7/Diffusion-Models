data:
  kind: latents
  name: celeba128_latents
  root: outputs/celeba128_latent_cache
  image_size: 16
  channels: 16
  train_limit: 0
  validation_limit: 0
  horizontal_flip: false
model:
  kind: dit
  image_size: 16
  patch_size: 2
  width: 384
  depth: 12
  heads: 6
  mlp_ratio: 4
  channels: 16
  out_channels: 16
  gradient_checkpointing: false
algorithm: edm
seed: 42
device: cuda:2
cpu_threads: 4
workers: 4
run_dir: outputs/celeba128_latent_dit_quality
conditional: false
label_dropout: 0.1
steps: 100000
batch_size: 64
accumulation: 2
lr: 0.0002
lr_schedule: constant
warmup_steps: 1000
weight_decay: 0.0
grad_clip: 1.0
ema_decay: 0.9999
amp: true
log_every: 100
save_every: 1000
preview_every: 2000
preview_scale: 1.5
sampling_steps: 18
resume: null
teacher: null
student_steps: 16
sigma_data: 1
sigma_min: 0.002
sigma_max: 80.0
rho: 7.0
p_mean: -0.5
p_std: 1.2
