data:
  kind: images
  name: celeba_hq
  root: /data/tii/Image_data/celeba_hq_256
  image_size: 32
  holdout_fraction: 0.0
  split_seed: 123
  train_limit: 4096
  validation_limit: 512
model:
  kind: unet
  width: 32
process:
  kind: ddpm
  prediction: epsilon
  steps: 1000
  schedule: cosine
sampler:
  method: ddim
  steps: 100
  eta: 0.0
  clip_x0: true
seed: 42
device: cuda:0
cpu_threads: 4
workers: 2
run_dir: outputs/celeba_ddpm
steps: 3000
batch_size: 64
lr: 0.0002
weight_decay: 1.0e-05
grad_clip: 1.0
ema_decay: 0.995
amp: true
conditional: false
label_dropout: 0.15
classifier_steps: 0
log_every: 200
validate_every: 1000
validation_samples: 256
evaluation_samples: 128
image_metrics: true
metric_batch_size: 32
resume: null
