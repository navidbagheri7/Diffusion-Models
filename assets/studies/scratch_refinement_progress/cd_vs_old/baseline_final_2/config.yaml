data:
  kind: images
  name: cifar10
  root: /data/tii/Image_data/cifar10
  image_size: 32
  channels: 3
  horizontal_flip: true
  holdout_fraction: 0.0
  split_seed: 123
  train_limit: 0
  validation_limit: 0
model:
  kind: image_unet
  width: 64
  channels: 3
  out_channels: 3
  channel_mult:
  - 1
  - 2
  - 2
  - 2
  blocks_per_level: 2
  attention_levels:
  - 1
  - 2
  dropout: 0
algorithm: distillation
seed: 42
device: cuda:0
cpu_threads: 4
workers: 4
run_dir: outputs/cifar10_consistency_distilled
conditional: true
label_dropout: 0.1
steps: 30000
batch_size: 64
accumulation: 2
lr: 0.0002
lr_schedule: constant
warmup_steps: 1000
weight_decay: 0.0
grad_clip: 1.0
ema_decay: 0.999
amp: true
log_every: 100
save_every: 1000
preview_every: 2000
preview_scale: 1
sampling_steps: 4
resume: null
teacher: outputs/cifar10_edm_quality/checkpoint_0100000.pt
student_steps: 16
sigma_data: 0.5
sigma_min: 0.002
sigma_max: 80.0
rho: 7.0
p_mean: -1.2
p_std: 1.2
consistency_scales_min: 40
consistency_scales_max: 40
flow_path: linear
diffusion_steps: 1000
schedule: cosine
prediction: epsilon
learned_variance: false
objective: hybrid
hybrid_weight: 0.001
timestep_sampling: uniform
