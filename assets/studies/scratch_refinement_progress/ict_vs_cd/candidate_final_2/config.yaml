  width: 64
  channels: 3
  out_channels: 3
  channel_mult:
  - 1
  - 2
  - 2
  - 2
  blocks_per_level: 2
  attention_levels:
  - 1
  - 2
  dropout: 0.0
  time_embedding: positional
algorithm: improved_consistency
seed: 42
device: cuda:2
cpu_threads: 4
workers: 4
run_dir: /home/navid.bagheri-shouraki/Diffusion/outputs/cifar10_ict_refined
