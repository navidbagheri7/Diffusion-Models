name: Scientific checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install tested CPU PyTorch pair
        run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the laboratory and checks
        run: python -m pip install -e ".[dev,notebooks]" ruff==0.16.9
      - name: Format and lint
        run: |
          ruff format --check diffusion_lab tests scripts notebooks train_diffusion.py setup.py
          ruff check diffusion_lab tests scripts notebooks train_diffusion.py setup.py
      - name: Analytic and data-split tests
        run: python -m pytest -q
      - name: Documentation targets
        run: python scripts/check_docs.py
      - name: Publication file set
        run: python -m scripts.check_publication
      - name: Executable CPU lessons
        run: python scripts/execute_notebooks.py
