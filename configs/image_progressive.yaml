defaults:
  - image_train
  - override data: mnist
  - _self_
algorithm: progressive
prediction: x0
learned_variance: false
steps: 5000
lr: 0.0001
warmup_steps: 200
student_steps: 16
sampling_steps: ${student_steps}
preview_scale: 1.0
ema_decay: 0.999
model:
  dropout: 0.0
run_dir: outputs/${data.name}_progressive_${student_steps}
